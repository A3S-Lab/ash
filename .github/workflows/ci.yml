name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  style:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Check and test fuzz harnesses
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path fuzz/Cargo.toml --bins --locked
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path fuzz/Cargo.toml --locked
      - name: Check third-party license inventory
        shell: pwsh
        run: ./scripts/check-third-party-licenses.ps1
      - name: Verify deterministic token evidence
        run: cargo run -p a3s-ash-bench --locked -- --check benches/reports/v0.1.0/format.json
      - name: Test minimal machine build
        run: cargo test -p a3s-ash --all-targets --no-default-features --locked
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Verify native-shell task corpus
        run: cargo run -p a3s-ash-bench --locked -- --check-task-lock benches/tasks/v1/lock.json
      - name: Test all targets
        run: cargo test --workspace --all-targets --locked

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install Linux MUSL toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add --toolchain 1.97.1 x86_64-unknown-linux-musl
      - name: Build Linux installer fixture
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p a3s-ash
      - name: Build macOS installer fixture
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p a3s-ash
      - name: Build Windows installer fixture
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p a3s-ash
      - name: Test Unix installer
        if: runner.os == 'Linux'
        run: sh scripts/test-install.sh target/x86_64-unknown-linux-musl/release/ash
      - name: Test macOS installer
        if: runner.os == 'macOS'
        run: sh scripts/test-install.sh target/release/ash
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-install.ps1 -Binary target/release/ash.exe
