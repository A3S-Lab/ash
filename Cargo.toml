[workspace]
members = [
    "benches/runner",
    "crates/ash-cli",
    "crates/ash-engine",
    "crates/ash-ops",
    "crates/ash-platform",
    "crates/ash-protocol",
    "crates/ash-shell",
    "crates/ash-store",
    "crates/ash-update",
    "tools/release",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["A3S Lab"]
license = "MIT"
repository = "https://github.com/A3S-Lab/ash"
homepage = "https://a3s-lab.github.io/ash/"

[workspace.dependencies]
ash-cli = { package = "a3s-ash", path = "crates/ash-cli" }
ash-engine = { package = "a3s-ash-engine", path = "crates/ash-engine" }
ash-ops = { package = "a3s-ash-ops", path = "crates/ash-ops" }
ash-platform = { package = "a3s-ash-platform", path = "crates/ash-platform" }
ash-protocol = { package = "a3s-ash-protocol", path = "crates/ash-protocol" }
ash-shell = { package = "a3s-ash-shell", path = "crates/ash-shell" }
ash-store = { package = "a3s-ash-store", path = "crates/ash-store" }
ash-update = { package = "a3s-ash-update", path = "crates/ash-update" }
atomicwrites = "0.4.4"
blake3 = { version = "1.8.5", features = ["rayon"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures = "0.3.33"
process-wrap = { version = "9.1.0", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "system-proxy"] }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
semver = "1.0.28"
same-file = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zeroize = "1.9.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
