<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">ash — AI Native Shell</title>
  <desc id="desc">A technical title composition showing ash, a typed program moving through bounded I/O and CPU execution planes, and a compact ASON search result.</desc>

  <rect width="1200" height="400" rx="26" fill="#080B0C"/>
  <path d="M0 350H1200" stroke="#27302C"/>
  <path d="M618 24V326" stroke="#27302C"/>

  <g id="identity" transform="translate(56 48)">
    <text x="0" y="20" fill="#78F5A4" font-size="18" font-weight="700" letter-spacing="2.1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TYPED / MULTICORE / TOKEN-BOUNDED</text>
    <text x="-4" y="140" fill="#F2F5F3" font-size="112" font-weight="800" letter-spacing="-7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">ash</text>
    <text x="0" y="188" fill="#F2F5F3" font-size="34" font-weight="650" letter-spacing="-0.8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">AI Native Shell</text>
    <text x="0" y="240" fill="#8B9690" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">typed DAG</text>
    <text x="102" y="240" fill="#405048" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→</text>
    <text x="134" y="240" fill="#8B9690" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">I/O + CPU</text>
    <text x="244" y="240" fill="#405048" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→</text>
    <text x="276" y="240" fill="#8B9690" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stable merge</text>
    <text x="414" y="240" fill="#405048" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→</text>
    <text x="446" y="240" fill="#78F5A4" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ASON</text>
  </g>

  <g id="ason-specimen" transform="translate(658 42)">
    <rect width="486" height="284" rx="18" fill="#101516" stroke="#334039"/>
    <path d="M0 52H486" stroke="#334039"/>
    <rect x="20" y="18" width="8" height="16" rx="4" fill="#78F5A4"/>
    <text x="42" y="33" fill="#B8C2BD" font-size="18" font-weight="700" letter-spacing="1.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ASON / SEARCH RESULT</text>

    <g transform="translate(24 77)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="0" y="0" fill="#78F5A4">t:</text><text x="24" y="0" fill="#F2F5F3">3</text>
      <text x="80" y="0" fill="#78F5A4">i:</text><text x="104" y="0" fill="#F2F5F3">17</text>
      <text x="168" y="0" fill="#78F5A4">s:</text><text x="192" y="0" fill="#F2F5F3">0</text>

      <text x="0" y="36" fill="#78F5A4">p[1]{i,v}:</text>
      <text x="0" y="68" fill="#D8DEDB">1,src/lib.rs</text>

      <text x="0" y="104" fill="#78F5A4">d[2]{p,l,c,t}:</text>
      <text x="0" y="136" fill="#D8DEDB">1,42,7,"TODO item"</text>
      <text x="0" y="168" fill="#D8DEDB">1,87,3,"FIXME item"</text>

      <text x="0" y="210" fill="#78F5A4">z:</text><text x="24" y="210" fill="#F2F5F3">1</text>
      <text x="80" y="210" fill="#78F5A4">r:</text><text x="104" y="210" fill="#F2F5F3">@7</text>
      <text x="166" y="210" fill="#6F7C75" font-size="18">bounded → retained</text>
    </g>
  </g>

  <g id="platform-contract" transform="translate(56 374)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
    <text x="0" y="0" fill="#F2F5F3">RUST</text>
    <text x="72" y="0" fill="#405048">/</text>
    <text x="96" y="0" fill="#F2F5F3">LINUX</text>
    <text x="189" y="0" fill="#405048">/</text>
    <text x="213" y="0" fill="#F2F5F3">MACOS</text>
    <text x="306" y="0" fill="#405048">/</text>
    <text x="330" y="0" fill="#F2F5F3">WINDOWS</text>
    <text x="1008" y="0" text-anchor="end" fill="#8B9690">ASH/1</text>
    <circle cx="1055" cy="-6" r="6" fill="#78F5A4"/>
    <text x="1080" y="0" fill="#F2F5F3">SPEC</text>
  </g>
</svg>
