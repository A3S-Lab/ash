<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ash dual-plane multi-core architecture</title>
  <desc id="desc">A coding agent request becomes a typed program governed by budgets, runs through separate Tokio I/O and Rayon CPU planes, uses native Linux, macOS, or Windows backends, then passes through stable merge, bounded storage, reduction, and canonical ASON.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#66746D"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="26" fill="#080B0C"/>
  <text x="48" y="54" fill="#F2F5F3" font-size="34" font-weight="750" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">Typed once. Parallel inside. Deterministic outside.</text>
  <text x="48" y="84" fill="#8B9690" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PROGRAM DAG → BOUNDED EXECUTION → STABLE MERGE → ASON</text>

  <g id="request-path" transform="translate(48 110)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g id="caller">
      <rect width="210" height="82" rx="14" fill="#121718" stroke="#344039"/>
      <text x="18" y="32" fill="#78F5A4" font-size="18" font-weight="700">01 / CALLER</text>
      <text x="18" y="62" fill="#F2F5F3" font-size="21" font-weight="700">CODING AGENT</text>
    </g>
    <path d="M210 41H242" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="protocol" transform="translate(252)">
      <rect width="210" height="82" rx="14" fill="#121718" stroke="#344039"/>
      <text x="18" y="32" fill="#78F5A4" font-size="18" font-weight="700">02 / PROTOCOL</text>
      <text x="18" y="62" fill="#F2F5F3" font-size="21" font-weight="700">ASH/1 + ASON</text>
    </g>
    <path d="M462 41H494" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="program" transform="translate(504)">
      <rect width="210" height="82" rx="14" fill="#121718" stroke="#344039"/>
      <text x="18" y="32" fill="#78F5A4" font-size="18" font-weight="700">03 / SEMANTICS</text>
      <text x="18" y="62" fill="#F2F5F3" font-size="21" font-weight="700">TYPED PROGRAM</text>
    </g>
    <path d="M714 41H746" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>
    <g id="governor" transform="translate(756)">
      <rect width="348" height="82" rx="14" fill="#162019" stroke="#78F5A4"/>
      <text x="18" y="32" fill="#78F5A4" font-size="18" font-weight="700">04 / HIERARCHICAL GOVERNOR</text>
      <text x="18" y="62" fill="#F2F5F3" font-size="20" font-weight="700">DAG · CPU · PROCESS · BYTES</text>
    </g>
  </g>

  <path d="M978 192V215H400V238" fill="none" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M978 215H970V238" fill="none" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="dual-plane-runtime" transform="translate(48 246)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="704" height="202" rx="16" fill="#0E1314" stroke="#344039"/>
    <text x="20" y="32" fill="#8B9690" font-size="18" font-weight="700">DUAL-PLANE RUNTIME</text>

    <g id="io-plane" transform="translate(20 52)">
      <rect width="318" height="126" rx="12" fill="#171D1B" stroke="#405048"/>
      <text x="18" y="31" fill="#78F5A4" font-size="19" font-weight="700">TOKIO / I/O PLANE</text>
      <text x="18" y="65" fill="#F2F5F3" font-size="19">RPC · PROCESS · PIPES</text>
      <text x="18" y="96" fill="#B8C2BD" font-size="18">DEADLINE · CANCEL · EVENTS</text>
    </g>

    <path d="M348 115H368" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>

    <g id="compute-plane" transform="translate(378 52)">
      <rect width="306" height="126" rx="12" fill="#171D1B" stroke="#78F5A4"/>
      <text x="18" y="31" fill="#78F5A4" font-size="19" font-weight="700">RAYON / CPU PLANE</text>
      <text x="18" y="65" fill="#F2F5F3" font-size="19">SEARCH · HASH · DIFF</text>
      <text x="18" y="96" fill="#B8C2BD" font-size="18">WORK STEALING · N CORES</text>
    </g>
  </g>

  <g id="operations" transform="translate(790 246)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="362" height="202" rx="16" fill="#0E1314" stroke="#344039"/>
    <text x="20" y="32" fill="#8B9690" font-size="18" font-weight="700">PORTABLE OPERATIONS</text>
    <text x="20" y="72" fill="#F2F5F3" font-size="22" font-weight="700">X  R  L  G  P</text>
    <text x="20" y="108" fill="#F2F5F3" font-size="22" font-weight="700">F  B  H  S  K</text>
    <rect x="20" y="132" width="322" height="48" rx="10" fill="#162019" stroke="#405048"/>
    <text x="181" y="163" text-anchor="middle" fill="#78F5A4" font-size="18" font-weight="700">STABLE KEY MERGE</text>
  </g>

  <path d="M752 347H782" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 448V472" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M970 448V472" stroke="#66746D" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="platforms" transform="translate(48 480)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="704" height="96" rx="16" fill="#0E1314" stroke="#344039"/>
    <text x="20" y="28" fill="#8B9690" font-size="18" font-weight="700">NATIVE PROCESS + FILESYSTEM BOUNDARY</text>
    <g transform="translate(20 42)" font-size="19" font-weight="700">
      <rect width="202" height="38" rx="9" fill="#171D1B"/>
      <text x="101" y="26" text-anchor="middle" fill="#F2F5F3">LINUX</text>
      <rect x="231" width="202" height="38" rx="9" fill="#171D1B"/>
      <text x="332" y="26" text-anchor="middle" fill="#F2F5F3">MACOS</text>
      <rect x="462" width="202" height="38" rx="9" fill="#171D1B"/>
      <text x="563" y="26" text-anchor="middle" fill="#F2F5F3">WINDOWS</text>
    </g>
  </g>

  <g id="result-path" transform="translate(790 480)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="362" height="96" rx="16" fill="#162019" stroke="#78F5A4"/>
    <text x="18" y="29" fill="#78F5A4" font-size="18" font-weight="700">05 / MODEL CONTEXT</text>
    <text x="18" y="61" fill="#F2F5F3" font-size="20" font-weight="700">STORE @N → REDUCE → ASON</text>
    <text x="18" y="84" fill="#8B9690" font-size="18">BOUNDED · CANONICAL</text>
  </g>

  <text x="48" y="604" fill="#8B9690" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">parallel completion order never becomes protocol order</text>
  <circle cx="1120" cy="598" r="6" fill="#78F5A4"/>
  <text x="1098" y="604" text-anchor="end" fill="#F2F5F3" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DETERMINISTIC</text>
</svg>
